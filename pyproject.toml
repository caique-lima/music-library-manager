[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "ffmpeg-python>=0.2",
    "mutagen>=1.47",
    "pyacoustid>=1.3",
    "musicbrainzngs>=0.7",
    "requests>=2.32",
    "rich>=13.0",
]

[project.optional-dependencies]
stems = [
    "demucs>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
music-manager = "music_manager.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/music_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires ACOUSTID_API_KEY and network access (run with: ACOUSTID_API_KEY=<key> pytest tests/integration/ -m integration)",
]

[tool.music-manager]
# Minimum fraction of field checks (title/artist/album/year) that must pass
# across all integration fixtures. Raise this as pipeline accuracy improves.
integration_accuracy_threshold = 0.80

[dependency-groups]
dev = [
    "beets>=2.11.0",
    "shazamio>=0.8.1",
]
