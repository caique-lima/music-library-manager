name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v

  shazam-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Shazam accuracy test
        run: uv run pytest tests/integration/test_shazam.py -m integration -v -s

  acoustid-tests:
    runs-on: ubuntu-latest
    # Only run on pushes to main — PRs don't have the secret and hit real APIs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run AcoustID accuracy test
        env:
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
        run: uv run pytest tests/integration/test_acoustid.py -m integration -v -s
